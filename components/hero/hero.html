<section class="sophia-hero" id="hero">

  <!-- 200vh tall → sticky stage pins for the full scroll-through -->
  <div class="sophia-hero__stage">

    <!-- Full-bleed hero video -->
    <video
      class="sophia-hero__video"
      src="assets/videos/vid-2.mp4"
      autoplay
      muted
      playsinline
      webkit-playsinline
      preload="auto"
      aria-hidden="true"
    ></video>

    <!-- Dark vignette overlay -->
    <div class="sophia-hero__overlay" aria-hidden="true"></div>

    <!-- Bottom CTA (Gucci minimal) -->
    <div class="sophia-hero__content">
      <a href="#welcome" class="sophia-hero__cta sophia-reveal">Discover</a>
    </div>

    <a href="#welcome" class="sophia-hero__scroll-hint" aria-label="Scroll down">
      <span class="sophia-hero__scroll-label">Scroll</span>
      <span class="sophia-hero__scroll-track" aria-hidden="true">
        <span class="sophia-hero__scroll-line"></span>
        <span class="sophia-hero__scroll-thumb"></span>
      </span>
      <svg class="sophia-hero__scroll-chevron" width="9" height="5" viewBox="0 0 9 5" fill="none" aria-hidden="true">
        <path d="M1 1.25 4.5 4.25 8 1.25" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </a>

  </div>

</section>
