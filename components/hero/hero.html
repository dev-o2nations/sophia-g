<section class="sophia-hero" id="hero">

  <!-- 200vh tall → sticky stage pins for the full scroll-through -->
  <div class="sophia-hero__stage">

    <!-- Full-bleed hero video -->
    <video
      class="sophia-hero__video"
      src="assets/videos/vid-2.mp4"
      autoplay
      muted
      playsinline
      webkit-playsinline
      preload="auto"
      aria-hidden="true"
    ></video>

    <!-- Dark vignette overlay -->
    <div class="sophia-hero__overlay" aria-hidden="true"></div>

    <!-- Bottom CTA (Gucci minimal) -->
    <div class="sophia-hero__content">
      <a href="#welcome" class="sophia-hero__cta sophia-reveal">Discover</a>
    </div>

    <!-- Scroll hint — editorial luxury rail -->
    <a href="#welcome" class="sophia-hero__scroll-hint" aria-label="Scroll to explore">
      <span class="sophia-hero__scroll-word">Scroll</span>
      <span class="sophia-hero__scroll-rail" aria-hidden="true">
        <span class="sophia-hero__scroll-rail-line"></span>
        <span class="sophia-hero__scroll-rail-gem"></span>
      </span>
    </a>

  </div>

</section>
