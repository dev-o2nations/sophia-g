<section class="sophia-services" id="services">
  <header class="sophia-services__header sophia-reveal">
    <h2 class="sophia-services__title">Sophia-G <em>World</em></h2>
  </header>

  <div class="sophia-services__grid">

    <article class="sophia-service-card sophia-reveal" id="house" data-service="house">
      <div class="sophia-service-card__media">
        <video
          class="sophia-service-card__video"
          src="assets/videos/Video-1.mp4"
          data-clip-ranges="0-30"
          autoplay muted loop playsinline
          poster="assets/images/img4.jpg"
        ></video>
        <button type="button" class="sophia-service-card__vp-btn" aria-label="Pause video">
          <svg class="sophia-service-card__vp-icon sophia-service-card__vp-icon--pause" width="10" height="10" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <rect x="7" y="5" width="2.5" height="14"/>
            <rect x="14.5" y="5" width="2.5" height="14"/>
          </svg>
          <svg class="sophia-service-card__vp-icon sophia-service-card__vp-icon--play" width="10" height="10" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <polygon points="8,5 19,12 8,19"/>
          </svg>
        </button>
      </div>
      <a href="#" class="sophia-service-card__link">
        <div class="sophia-service-card__body">
          <h3 class="sophia-service-card__name"><em>House</em></h3>
          <span class="sophia-service-card__action">Discover</span>
        </div>
      </a>
    </article>

    <article class="sophia-service-card sophia-service-card--color sophia-reveal" id="life" data-service="life">
      <div class="sophia-service-card__media">
        <video
          class="sophia-service-card__video"
          src="assets/videos/vid-3.mp4"
          autoplay muted loop playsinline
          poster="assets/images/s2.png"
        ></video>
        <button type="button" class="sophia-service-card__vp-btn" aria-label="Pause video">
          <svg class="sophia-service-card__vp-icon sophia-service-card__vp-icon--pause" width="10" height="10" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <rect x="7" y="5" width="2.5" height="14"/>
            <rect x="14.5" y="5" width="2.5" height="14"/>
          </svg>
          <svg class="sophia-service-card__vp-icon sophia-service-card__vp-icon--play" width="10" height="10" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <polygon points="8,5 19,12 8,19"/>
          </svg>
        </button>
      </div>
      <a href="#" class="sophia-service-card__link">
        <div class="sophia-service-card__body">
          <h3 class="sophia-service-card__name"><em>Life</em></h3>
          <span class="sophia-service-card__action">Checkout</span>
        </div>
      </a>
    </article>

    <article class="sophia-service-card sophia-service-card--atelier sophia-reveal" id="atelier" data-service="atelier">
      <div class="sophia-service-card__media">
        <video
          class="sophia-service-card__video"
          src="assets/videos/Video-1.mp4"
          data-clip-ranges="31-53"
          autoplay muted loop playsinline
          poster="assets/images/img3.jpg"
        ></video>
        <button type="button" class="sophia-service-card__vp-btn" aria-label="Pause video">
          <svg class="sophia-service-card__vp-icon sophia-service-card__vp-icon--pause" width="10" height="10" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <rect x="7" y="5" width="2.5" height="14"/>
            <rect x="14.5" y="5" width="2.5" height="14"/>
          </svg>
          <svg class="sophia-service-card__vp-icon sophia-service-card__vp-icon--play" width="10" height="10" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <polygon points="8,5 19,12 8,19"/>
          </svg>
        </button>
      </div>
      <a href="#" class="sophia-service-card__link">
        <div class="sophia-service-card__body">
          <h3 class="sophia-service-card__name"><em>Atelier</em></h3>
          <span class="sophia-service-card__action">Book an appointment</span>
        </div>
      </a>
    </article>

  </div>
</section>
